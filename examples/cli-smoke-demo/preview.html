<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clean UI CLI Smoke Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./generated/demo-button.css" />
    <style>
      :root {
        --button-background: #1f2937;
        --button-background-hover: #111827;
        --button-border: #374151;
        --button-foreground: #f9fafb;
        --button-radius: 0.5rem;
        --button-ring: #2563eb;
        --destructive: #b91c1c;
        --destructive-foreground: #fff7ed;
        color: #111827;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        background: #f3f4f6;
        margin: 0;
        min-block-size: 100vh;
      }

      main {
        display: grid;
        gap: 2rem;
        margin: 0 auto;
        max-inline-size: 760px;
        padding: 4rem 1.5rem;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 2rem;
        line-height: 1.1;
      }

      p {
        color: #4b5563;
        line-height: 1.6;
      }

      .demo-grid {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .demo-button--outline,
      .demo-button--ghost {
        --button-foreground: #111827;
      }

      .demo-button--glass {
        --button-background: color-mix(in srgb, #111827 18%, transparent);
        --button-border: color-mix(in srgb, #111827 20%, transparent);
        --button-foreground: #111827;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>CLI smoke demo</h1>
        <p>
          Run the demo write command first. This page then loads the generated CSS and shows
          semantic button markup using the generated class contract.
        </p>
      </div>

      <section class="demo-grid" aria-label="Generated button preview">
        <button class="demo-button demo-button--glass demo-button--md" type="button">
          <span class="demo-button__content">Glass button</span>
        </button>
        <button class="demo-button demo-button--solid demo-button--md" type="button">
          <span class="demo-button__content">Solid button</span>
        </button>
        <button class="demo-button demo-button--outline demo-button--sm" type="button">
          <span class="demo-button__content">Small outline</span>
        </button>
        <button class="demo-button demo-button--destructive demo-button--lg" type="button">
          <span class="demo-button__content">Large destructive</span>
        </button>
        <button class="demo-button demo-button--glass demo-button--md" type="button" disabled>
          <span class="demo-button__content">Disabled</span>
        </button>
      </section>
    </main>
  </body>
</html>
